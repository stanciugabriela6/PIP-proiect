# ===================================
# MODEL SELECTION (LOCAL OLLAMA)
# ===================================
spring.ai.model.chat=ollama
spring.ai.model.embedding=ollama

# ===================================
# OLLAMA - CHAT + EMBEDDINGS
# ===================================
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.ai.openai.embedding.enabled=false

# ===================================
# CHROMA - VECTOR DB
# ===================================
spring.ai.vectorstore.chroma.embedding-client=ollama
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8001
spring.ai.vectorstore.chroma.collection-name=company-docs
spring.ai.vectorstore.chroma.initialize-schema=true

# ===================================
# UPLOAD
# ===================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===================================
# LOGGING
# ===================================
logging.level.org.springframework.ai=DEBUG
